
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wipeout Pimo</title>
    <meta name="description" content="Help pimo navigate the rainbow hills! Avoid cheeky Glimmer Stars and obstacles in this high-energy 3D wipeout challenge. Customize your pimo, connect with friends, and conquer the hills together!">
    <meta property="og:title" content="Wipeout Pimo">
    <meta property="og:description" content="Help pimo navigate the rainbow hills! Avoid cheeky Glimmer Stars and obstacles in this high-energy 3D wipeout challenge. Customize your pimo, connect with friends, and conquer the hills together!">
    <link rel="icon" type="image/svg+xml" href="/pimo-studios-logo.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&family=Noto+Sans:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', 'Noto Sans', 'Noto Sans Arabic', 'Noto Sans Devanagari', 'Noto Sans SC', sans-serif;
            background-color: #0f172a; /* Default dark mode background */
            overflow: hidden;
        }
        body.light {
            background-color: #f8fafc; /* Light mode background */
        }
        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }
    </style>
<link rel="stylesheet" href="/index.css">
<script>
  window.addEventListener('error', function(e) {
    var errorDiv = document.createElement('div');
    errorDiv.style.cssText = 'color:red; background:white; position:fixed; z-index:99999; top:0; left:0; width:100vw; height:100vh; padding:20px; font-size:24px; overflow:auto;';
    errorDiv.textContent = 'Global Error: ' + e.message + '\n' + (e.error ? e.error.stack : '');
    document.body.appendChild(errorDiv);
  });
  window.addEventListener('unhandledrejection', function(e) {
    var errorDiv = document.createElement('div');
    errorDiv.style.cssText = 'color:red; background:white; position:fixed; z-index:99999; top:0; left:0; width:100vw; height:100vh; padding:20px; font-size:24px; overflow:auto;';
    errorDiv.textContent = 'Unhandled Rejection: ' + e.reason;
    document.body.appendChild(errorDiv);
  });
</script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
